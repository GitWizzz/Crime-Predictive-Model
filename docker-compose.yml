version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: crime-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_DB: ${POSTGRES_DB:-crime_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-service:
    build:
      context: ./ml-service
    container_name: crime-ml
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
    container_name: crime-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:your_password@db:5432/crime_hotspot_db}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_SSL: "false"
    depends_on:
      - db
      - ml-service
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: crime-frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
